<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío 02 - Registro con Bloqueo de Dominios</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <div class="bg-overlay"></div>
    <main class="container">
        <section class="card">
            <header class="card-header">
                <div class="logo-icon">✦</div>
                <h2>Registro Institucional</h2>
                <p class="subtitle">Acceso restringido a miembros autorizados</p>
            </header>

            <form id="register-form" autocomplete="off">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="usuario@miinstitucion.edu.py" required>
                    <span class="hint">Requerido: <strong>@miinstitucion.edu.py</strong></span>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••••••" minlength="6" required>
                </div>

                <button type="submit" id="submit-btn" class="btn-gold">
                    <span>Crear Cuenta</span>
                </button>
            </form>

            <div id="status-message" class="message hidden"></div>
        </section>
    </main>

    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="java.js"></script>
</body>
</html>
